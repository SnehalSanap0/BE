# Paper experiment E1: ordinary (non-paired), count-matched Hindi SEA-Spoof
# training — the control condition for the E2 transcript-paired experiment.
# Same sources, counts, model, and training budget as
# configs/config.paper_seaspoof.yaml; the only difference is
# ingestion.allow_pairing: false, so real/fake clips are sampled
# independently instead of matched by transcript, and dataset.split_assigner
# assigns splits by ordinary label-stratified sampling (see
# scripts/run_nonpaired_seaspoof_experiment.py) instead of transcript
# grouping. Artifacts are isolated from the E2 paired run.
paths:
  data_dir: "data/paper_seaspoof_nonpaired"
  raw_dir: "data/paper_seaspoof_nonpaired/raw"
  processed_dir: "data/paper_seaspoof_nonpaired/processed"
  feature_dir: "data/paper_seaspoof_nonpaired/features"
  metadata_dir: "data/paper_seaspoof_nonpaired/metadata"
  metadata_file: "data/paper_seaspoof_nonpaired/metadata/metadata.csv"
  log_dir: "logs/paper_seaspoof_nonpaired"
  checkpoint_dir: "checkpoints/paper_seaspoof_nonpaired"
  output_dir: "outputs/paper_seaspoof_nonpaired"
  explanation_dir: "outputs/paper_seaspoof_nonpaired/explanations"

audio:
  sample_rate: 16000
  mono: true
  target_duration_seconds: 4
  remove_silence: true
  top_db: 30
  normalize: true
  pad_mode: "constant"
  supported_formats: [".wav", ".flac", ".mp3", ".ogg"]

dataset:
  languages: ["hindi"]
  labels: ["real", "fake"]
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42

ingestion:
  language: "hindi"
  hf_token_env_var: "HF_TOKEN"
  allow_pairing: false
  real:
    - dataset: "Jack-ppkdczgx/SEA-Spoof"
      config_name: null
      split: "train"
      label: "real"
      audio_field: "audio"
      target_count: 3000
      source_tag: "real_sea"
      filters:
        - field: "language"
          value: "hi"
        - field: "label"
          value: "bonafide"
  fake:
    - dataset: "Jack-ppkdczgx/SEA-Spoof"
      config_name: null
      split: "train"
      label: "fake"
      audio_field: "audio"
      target_count: 3000
      source_tag: "fake_sea"
      filters:
        - field: "language"
          value: "hi"
        - field: "label"
          value: "spoof"

features:
  type: "mel_spectrogram"
  n_mels: 128
  n_mfcc: 40
  n_lfcc: 40
  n_fft: 1024
  hop_length: 512
  win_length: 1024
  fmin: 0
  fmax: 8000
  power: 2.0
  log_scale: true
  image_size: 224

model:
  backbone: "efficientnet_b0"
  pretrained: true
  num_classes: 2
  use_bilstm: false
  lstm_hidden_size: 256
  lstm_num_layers: 2
  lstm_bidirectional: true
  dropout: 0.3
  freeze_backbone: false

training:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0001
  mixed_precision: true
  gradient_clip_norm: 5.0
  num_workers: 4
  checkpoint_metric: "val_f1"
  resume: false

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "roc_auc", "eer", "confusion_matrix"]
  threshold: 0.5

explainability:
  method: "gradcam"
  target_layer: "backbone.conv_head"
  overlay_alpha: 0.5
  colormap: "jet"

deployment:
  host: "0.0.0.0"
  port: 5000
  debug: false
  max_upload_size_mb: 25
  allowed_extensions: [".wav"]
  model_checkpoint: "checkpoints/paper_seaspoof_nonpaired/seed_42/best_model.pt"
